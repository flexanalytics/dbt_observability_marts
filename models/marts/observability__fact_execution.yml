version: 2
models:
  - name: observability__fact_execution
    description: ''
    config:
      meta:
        label: Execution Fact
        display_index: 1
        joins:
          - to: observability__dim_execution
            type: inner
            join_on:
              - from_field: execution_key
                exp: '='
                to_field: execution_key
          - to: observability__dim_invocation
            type: inner
            join_on:
              - from_field: invocation_key
                exp: '='
                to_field: invocation_key
          - to: observability__dim_model
            type: inner
            join_on:
              - from_field: model_key
                exp: '='
                to_field: model_key
          - to: observability__dim_test
            type: inner
            join_on:
              - from_field: test_key
                exp: '='
                to_field: test_key
          - to: observability__dim_seed
            type: inner
            join_on:
              - from_field: seed_key
                exp: '='
                to_field: seed_key
          - to: observability__dim_source
            type: inner
            join_on:
              - from_field: source_key
                exp: '='
                to_field: source_key
          - to: observability__dim_snapshot
            type: inner
            join_on:
              - from_field: snapshot_key
                exp: '='
                to_field: snapshot_key
          - to: observability__dim_metric
            type: inner
            join_on:
              - from_field: metric_key
                exp: '='
                to_field: metric_key
          - to: observability__dim_exposure
            type: inner
            join_on:
              - from_field: exposure_key
                exp: '='
                to_field: exposure_key
          - to: observability__dim_date
            type: inner
            join_on:
              - from_field: date_key
                exp: '='
                to_field: date_key
    columns:
      - name: execution_key
        description: ''
        config:
          meta:
            hidden: true
        tests:
          - not_null
          - unique
      - name: invocation_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: model_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: test_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: seed_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: source_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: snapshot_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: metric_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: exposure_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: node_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: date_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
        constraints:
          - type: not_null
      - name: status
        description: 'Execution result status (e.g. pass, fail, error, warn, success)'
        data_type: text
        config:
          meta:
            label: Status
      - name: is_pass
        description: 'Flag (1/0) indicating the node execution passed'
        data_type: numeric
        config:
          meta:
            metrics:
              passed:
                sql: "${is_pass}"
                label: Passed
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: is_failure
        description: 'Flag (1/0) indicating the node execution failed or errored'
        data_type: numeric
        config:
          meta:
            metrics:
              failed:
                sql: "${is_failure}"
                label: Failed
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: is_warn
        description: 'Flag (1/0) indicating the node execution returned a warning'
        data_type: numeric
        config:
          meta:
            metrics:
              warned:
                sql: "${is_warn}"
                label: Warned
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: pass_rate
        description: 'Share of node executions that passed'
        config:
          meta:
            metrics:
              pass_rate:
                sql: "${is_pass}"
                label: Pass Rate
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
      - name: total_node_runtime
        description: ''
        data_type: numeric
        config:
          meta:
            metrics:
              total_node_runtime:
                label: Total Node Runtime
                type: sum
                format:
                  type: number
                  decimalPlaces: 1
                  suffix: s
      - name: previous_runtime
        description: ''
        data_type: numeric
        config:
          meta:
            metrics:
              previous_runtime:
                label: Previous Runtime
                type: sum
                format:
                  type: number
                  decimalPlaces: 1
                  suffix: s
      - name: average_runtime
        description: ''
        data_type: numeric
        config:
          meta:
            metrics:
              average_runtime:
                label: Average Runtime
                type: sum
                format:
                  type: number
                  decimalPlaces: 1
                  suffix: s
      - name: total_invocation_runtime
        description: ''
        data_type: numeric
        config:
          meta:
            metrics:
              total_invocation_runtime:
                label: Total Invocation Runtime
                type: sum
                format:
                  type: number
                  decimalPlaces: 1
                  suffix: s
      - name: runtime_percent_of_total
        description: 'Node runtime as a percent of total invocation runtime'
        config:
          meta:
            metrics:
              runtime_percent_of_total:
                sql: "${total_node_runtime} / ${total_invocation_runtime}"
                label: "% of Total Invocation Runtime"
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
      - name: change_from_previous_runtime
        description: 'Percent change from previous runtime'
        config:
          meta:
            metrics:
              change_from_previous_runtime:
                sql: "( ${total_node_runtime} - ${previous_runtime} ) / ${previous_runtime}"
                label: "% Change (Previous Runtime)"
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
      - name: change_from_average_runtime
        description: 'Percent change from average runtime'
        config:
          meta:
            metrics:
              change_from_average_runtime:
                sql: "( ${total_node_runtime} - ${average_runtime} ) / ${average_runtime}"
                label: "% Change (Average Runtime)"
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
      - name: node_count
        description: "Distinct count of Node ID"
        config:
          meta:
            metrics:
              node_count:
                sql: "${node_key}"
                label: Node Count
                type: count_distinct
                format:
                  type: number
                  decimalPlaces: 0
      - name: invocation_count
        description: "Distinct count of invocations"
        config:
          meta:
            metrics:
              invocation_count:
                sql: "${invocation_key}"
                label: Invocation Count
                type: count_distinct
                format:
                  type: number
                  decimalPlaces: 0
      - name: total_rowcount
        description: ''
        config:
          meta:
            metrics:
              total_rowcount:
                label: Total Rowcount
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: previous_rowcount
        description: ''
        config:
          meta:
            metrics:
              previous_rowcount:
                label: Previous Rowcount
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: average_rowcount
        description: ''
        config:
          meta:
            metrics:
              average_rowcount:
                label: Average Rowcount
                type: sum
                format:
                  type: number
                  decimalPlaces: 0
      - name: change_from_previous_rowcount
        description: 'Percent change from previous rowcount'
        config:
          meta:
            metrics:
              change_from_previous_rowcount:
                sql: "( ${total_rowcount} - ${previous_rowcount} ) / ${previous_rowcount}"
                label: "% Change (Previous Rowcount)"
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
      - name: change_from_average_rowcount
        description: 'Percent change from average rowcount'
        config:
          meta:
            metrics:
              change_from_average_rowcount:
                sql: "( ${total_rowcount} - ${average_rowcount} ) / ${average_rowcount}"
                label: "% Change (Average Rowcount)"
                type: average
                format:
                  type: percent
                  decimalPlaces: 1
                  suffix: "%"
