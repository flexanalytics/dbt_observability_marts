            label: Target Profile Name
      - name: target_name
        description: ''
        data_type: text
        config:
          meta:
            label: Target Name
      - name: target_schema
        description: ''
        data_type: text
        config:
          meta:
            label: Target Schema
      - name: target_threads
        description: ''
        data_type: int
        config:
          meta:
