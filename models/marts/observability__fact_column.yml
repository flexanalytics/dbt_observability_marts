version: 2
models:
  - name: observability__fact_column
    description: ''
    config:
      meta:
        label: Column Fact
        joins:
          - to: observability__dim_column
            type: inner
            join_on:
              - from_field: column_key
                exp: '='
                to_field: column_key
          - to: observability__dim_execution
            type: inner
            join_on:
              - from_field: execution_key
                exp: '='
                to_field: execution_key
    columns:
      - name: column_key
        data_type: text
        config:
          meta:
            hidden: true
            datatype: text
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('observability__dim_column')
                field: column_key
      - name: execution_key
        description: ''
        data_type: text
        config:
          meta:
            hidden: true
            datatype: text
        constraints:
          - type: not_null
      - name: is_documented
        description: ''
        data_type: boolean
        config:
          meta:
            label: Is Documented
            datatype: boolean
      - name: row_count
        description: ''
        data_type: bigint
        config:
          meta:
            label: Row Count
            datatype: bigint
      - name: row_distinct
        description: ''
        data_type: bigint
        config:
          meta:
            label: Row Distinct
            datatype: bigint
      - name: row_null
        description: ''
        data_type: bigint
        config:
          meta:
            label: Row Null
            datatype: bigint
      - name: row_min
        description: ''
        data_type: numeric
        config:
          meta:
            label: Row Min
            datatype: number
      - name: row_max
        description: ''
        data_type: numeric
        config:
          meta:
            label: Row Max
            datatype: number
      - name: row_avg
        description: ''
        data_type: numeric
        config:
          meta:
            label: Row Avg
            datatype: number
      - name: row_sum
        description: ''
        data_type: numeric
        config:
          meta:
            label: Row Sum
            datatype: number
      - name: row_stdev
        description: ''
        data_type: numeric
        config:
          meta:
            label: Row Stdev
            datatype: number
      - name: is_metric
        description: ''
        data_type: boolean
        config:
          meta:
            label: Is Metric
            datatype: boolean
      - name: column_values
        description: ''
        data_type: text
        config:
          meta:
            label: Column Values
            datatype: text
